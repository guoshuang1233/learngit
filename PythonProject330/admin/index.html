<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>后台管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei}
        body{background:#f0f2f5}

        .auth-container{max-width:400px;margin:150px auto;padding:40px;background:white;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
        .auth-title{text-align:center;font-size:24px;margin-bottom:30px;color:#333}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;margin-bottom:8px;color:#606266;font-size:14px}
        .form-group input{width:100%;padding:12px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px}
        .form-group input:focus{border-color:#409eff;outline:none}
        .submit-btn{width:100%;padding:12px;background:#34495e;color:white;border:none;border-radius:4px;font-size:16px;cursor:pointer}
        .submit-btn:hover{background:#2c3e50}
        .switch-auth{text-align:center;margin-top:20px;color:#606266}
        .switch-auth a{color:#409eff;cursor:pointer;text-decoration:none}

        .admin-layout{display:none;height:100vh}
        .sidebar{width:250px;background:#34495e;color:white;height:100vh;position:fixed;left:0;top:0;overflow-y:auto}
        .sidebar-header{padding:20px;text-align:center;font-size:20px;font-weight:bold;border-bottom:1px solid #2c3e50}
        .sidebar-menu{padding:20px 0}
        .menu-title{padding:12px 20px;color:#95a5a6;font-size:13px;text-transform:uppercase;margin-top:10px}
        .menu-item{padding:12px 20px;cursor:pointer;transition:all 0.3s;color:#ecf0f1}
        .menu-item:hover{background:#2c3e50}
        .menu-item.active{background:#2c3e50;border-left:3px solid #409eff}
        .logout-btn{width:100%;padding:12px;background:#e74c3c;color:white;border:none;cursor:pointer;font-size:14px}
        .logout-btn:hover{background:#c0392b}

        .main-content{margin-left:250px;padding:30px;min-height:100vh}
        .page-header{background:white;padding:20px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .page-title{font-size:24px;color:#333}

        .content-card{background:white;border-radius:8px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}

        .product-tabs{display:flex;gap:0;margin-bottom:20px}
        .product-tab{padding:12px 30px;background:#9e9e9e;color:white;border:none;cursor:pointer;font-size:14px;transition:all 0.3s}
        .product-tab:first-child{border-radius:4px 0 0 4px}
        .product-tab:last-child{border-radius:0 4px 4px 0}
        .product-tab.active{background:#f39c12}
        .product-tab:hover{opacity:0.9}

        .product-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #eee}
        .search-box{position:relative;flex:1;max-width:400px}
        .search-box input{width:100%;padding:10px 15px 10px 40px;border:1px solid #ddd;border-radius:4px;font-size:14px}
        .search-box input:focus{border-color:#409eff;outline:none}
        .search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px}
        .toolbar-right{display:flex;gap:15px;align-items:center}
        .toolbar-btn{padding:8px 16px;background:white;border:1px solid #ddd;border-radius:4px;cursor:pointer;font-size:13px;color:#666;display:flex;align-items:center;gap:5px}
        .toolbar-btn:hover{border-color:#409eff;color:#409eff}

        .product-list{background:white}
        .product-item{display:flex;padding:20px;border-bottom:1px solid #eee;gap:15px;transition:background 0.2s;align-items:flex-start}
        .product-item:hover{background:#fafafa}
        .product-item:last-child{border-bottom:none}

        .product-checkbox{padding-top:30px}
        .product-checkbox input{width:18px;height:18px;cursor:pointer}

        .product-preview{padding-top:30px;color:#409eff;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:5px}
        .product-preview:hover{text-decoration:underline}

        .product-main{flex:1;display:flex;gap:20px}
        .product-image{width:100px;height:100px;border:1px solid #eee;border-radius:4px;overflow:hidden;flex-shrink:0;background:#f5f5f5}
        .product-image img{width:100%;height:100%;object-fit:cover}

        .product-info{flex:1}
        .product-header{display:flex;align-items:center;gap:15px;margin-bottom:10px;flex-wrap:wrap}
        .product-status{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:500}
        .status-draft{background:#fff3e0;color:#f39c12}
        .status-onsale{background:#e8f5e9;color:#27ae60}
        .status-offshelf{background:#fce4ec;color:#e74c3c}

        .product-actions{display:flex;gap:15px;margin-left:auto;align-items:center}
        .action-link{color:#409eff;font-size:13px;cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:center;gap:5px}
        .action-link:hover{text-decoration:underline}
        .action-link.danger{color:#e74c3c}
        .action-link.disabled{color:#999;cursor:not-allowed}

        .item-number{color:#999;font-size:12px;margin-bottom:8px}
        .product-name{font-size:16px;font-weight:600;color:#333;margin-bottom:8px}
        .product-category{color:#666;font-size:13px;margin-bottom:8px}
        .product-stock-info{color:#666;font-size:13px;margin-bottom:8px}
        .product-price{color:#f39c12;font-size:15px;font-weight:600;margin-bottom:8px}
        .product-tags{margin-top:8px}
        .tag-link{color:#409eff;font-size:12px;cursor:pointer}
        .tag-link:hover{text-decoration:underline}

        .product-sidebar{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;min-width:200px}
        .update-info{text-align:right;color:#999;font-size:12px;line-height:1.8;margin-bottom:15px}
        .update-info span{color:#333;font-weight:500}
        .product-actions-bottom{display:flex;gap:15px}

        .can-upshelf{display:inline-block;padding:2px 8px;background:#e8f5e9;color:#27ae60;border-radius:12px;font-size:11px;margin-top:5px}

        .order-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
        .order-tab{padding:10px 20px;background:#95a5a6;color:white;border:none;border-radius:4px;cursor:pointer}
        .order-tab.active{background:#f39c12}
        .order-tab:hover{opacity:0.9}

        .filter-bar{display:flex;gap:15px;margin-bottom:20px;align-items:center}
        .filter-bar input{flex:1;padding:10px;border:1px solid #ddd;border-radius:4px}
        .filter-bar select{padding:10px;border:1px solid #ddd;border-radius:4px}

        table{width:100%;border-collapse:collapse}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
        th{background:#f8f9fa;font-weight:600;color:#333}
        tr:hover{background:#f5f5f5}

        .status-badge{padding:4px 12px;border-radius:12px;font-size:12px;color:white}
        .status-0{background:#f39c12}
        .status-1{background:#27ae60}
        .status-2{background:#3498db}
        .status-3{background:#2ecc71}
        .status-4{background:#e74c3c}

        .action-btn{padding:6px 12px;margin:0 4px;border:none;border-radius:4px;cursor:pointer;font-size:12px}
        .btn-view{background:#3498db;color:white}
        .btn-edit{background:#f39c12;color:white}
        .btn-delete{background:#e74c3c;color:white}

        .product-form{max-width:600px}
        .product-form .form-group{margin-bottom:20px}
        .product-form label{display:block;margin-bottom:8px;color:#606266;font-weight:500}
        .product-form input,.product-form select,.product-form textarea{width:100%;padding:10px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px}
        .product-form textarea{min-height:100px;resize:vertical}
        .submit-product{padding:12px 30px;background:#34495e;color:white;border:none;border-radius:4px;cursor:pointer;font-size:15px}
        .submit-product:hover{background:#2c3e50}

        .stock-input{width:80px;padding:6px;border:1px solid #ddd;border-radius:4px}
        .save-stock{padding:6px 12px;background:#27ae60;color:white;border:none;border-radius:4px;cursor:pointer;margin-left:10px}
    </style>
</head>
<body>
    <div class="auth-container" id="authApp">
        <div class="auth-title" id="authTitle">管理员登录</div>
        <form id="authForm">
            <div class="form-group">
                <label>用户名</label>
                <input id="username" placeholder="请输入用户名" required type="text">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input id="password" placeholder="请输入密码" required type="password">
            </div>
            <button class="submit-btn" id="submitBtn" type="submit">登录</button>
            <div class="switch-auth">
                <span id="switchText">还没有账号？</span>
                <a href="javascript:void(0)" id="switchLink" onclick="switchAuthMode(); return false;">立即注册</a>
            </div>
        </form>
    </div>

    <div class="admin-layout" id="adminLayout">
        <div class="sidebar">
            <div class="sidebar-header"> 后台管理</div>
            <div class="sidebar-menu">
                <div class="menu-title">产品管理</div>
                <div class="menu-item active" onclick="switchPage('addProduct')">添加产品</div>
                <div class="menu-item" onclick="switchPage('allProducts')">全部产品</div>
                <div class="menu-item" onclick="switchPage('stockManage')">库存管理</div>
                <div class="menu-item" onclick="switchPage('uploadImage')">图片上传</div>

                <div class="menu-title">订单管理</div>
                <div class="menu-item" onclick="switchPage('allOrders')">全部订单</div>
            </div>
            <div style="position:absolute;bottom:0;width:100%">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="main-content">
            <div id="addProductPage">
                <div class="page-header"><h1 class="page-title">添加产品</h1></div>
                <div class="content-card product-form">
                    <form id="productForm">
                        <div class="form-group">
                            <label>产品名称</label>
                            <input id="productName" required type="text">
                        </div>
                        <div class="form-group">
                            <label>价格 (¥)</label>
                            <input id="productPrice" required step="0.01" type="number">
                        </div>
                        <div class="form-group">
                            <label>库存</label>
                            <input id="productStock" required type="number" value="100">
                        </div>
                        <div class="form-group">
                            <label>分类</label>
                            <select id="productCategory">
                                <option value="">请选择分类</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>图片 URL</label>
                            <input id="productImage" placeholder="http://..." type="text">
                        </div>
                        <button class="submit-product" type="submit">提交产品</button>
                    </form>
                </div>
            </div>

            <div id="allProductsPage" style="display:none">
                <div class="page-header">
                    <div style="display:flex;justify-content:space-between;align-items:center">
                        <h1 class="page-title">全部产品</h1>
                        <a href="javascript:void(0)" style="color:#409eff;font-size:14px">标签管理</a>
                    </div>
                </div>
                <div class="content-card">
                    <div class="product-tabs">
                        <button class="product-tab active" onclick="filterProducts('all')">全部产品</button>
                        <button class="product-tab" onclick="filterProducts('draft')">草稿箱</button>
                        <button class="product-tab" onclick="filterProducts('on_sale')">出售中</button>
                        <button class="product-tab" onclick="filterProducts('off_shelf')">已下架</button>
                    </div>
                    <div class="product-toolbar">
                        <div class="search-box">
                            <input id="productSearch" oninput="searchProducts(this.value)" placeholder="搜索产品" type="text">
                        </div>
                        <div class="toolbar-right">
                            <button class="toolbar-btn" onclick="toggleFilter()"> 筛选</button>
                            <button class="toolbar-btn" onclick="sortProducts()"> 排序: 创建时间</button>
                        </div>
                    </div>
                    <div class="product-list" id="productList"></div>
                </div>
            </div>

            <div id="stockManagePage" style="display:none">
                <div class="page-header"><h1 class="page-title">库存管理</h1></div>
                <div class="content-card">
                    <table id="stockTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>产品名称</th>
                                <th>当前库存</th>
                                <th>调整数量</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="uploadImagePage" style="display:none">
                <div class="page-header"><h1 class="page-title">图片上传</h1></div>
                <div class="content-card">
                    <div id="uploadArea" onclick="document.getElementById('fileInput').click()" style="padding:40px;text-align:center;border:2px dashed #ddd;border-radius:8px;cursor:pointer">
                        <p style="color:#999">点击或拖拽图片到此区域上传</p>
                        <input accept="image/*" id="fileInput" onchange="handleFileUpload(this)" style="display:none" type="file">
                    </div>
                    <div id="uploadResult" style="margin-top:20px;display:none">
                        <p style="color:#27ae60">上传成功!</p>
                        <img id="previewImage" style="max-width:300px;margin:10px 0;border-radius:4px">
                        <div style="display:flex;gap:10px;align-items:center">
                            <input id="imageUrl" readonly style="flex:1;padding:8px;border:1px solid #ddd;border-radius:4px" type="text">
                            <button onclick="copyImageUrl()" style="padding:8px 16px;background:#409eff;color:white;border:none;border-radius:4px;cursor:pointer">复制URL</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="allOrdersPage" style="display:none">
                <div class="page-header"><h1 class="page-title">订单管理</h1></div>
                <div class="content-card">
                    <div class="order-tabs">
                        <button class="order-tab active" onclick="filterOrders(0)">全部订单</button>
                        <button class="order-tab" onclick="filterOrders(1)">待付款</button>
                        <button class="order-tab" onclick="filterOrders(2)">已付款</button>
                        <button class="order-tab" onclick="filterOrders(3)">已发货</button>
                        <button class="order-tab" onclick="filterOrders(4)">已完成</button>
                        <button class="order-tab" onclick="filterOrders(5)">已取消</button>
                    </div>
                    <div class="filter-bar">
                        <input id="orderSearch" placeholder="搜索订单号或用户名" type="text">
                        <select id="timeRange">
                            <option value="6">最近六个月</option>
                            <option value="3">最近三个月</option>
                            <option value="1">最近一个月</option>
                            <option value="0">全部</option>
                        </select>
                        <button class="action-btn btn-view" onclick="loadOrders()">搜索</button>
                    </div>
                    <table id="ordersTable">
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>用户</th>
                                <th>商品</th>
                                <th>总金额</th>
                                <th>状态</th>
                                <th>下单时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    const API = 'http://127.0.0.1:5000'
    let isLoginMode = true
    let currentAdmin = null
    let currentProductStatus = 'all'
    let currentProductKeyword = ''

    async function parseErrorMessage(res, fallbackMsg) {
        try {
            const data = await res.json()
            return (data && data.msg) ? data.msg : fallbackMsg
        } catch (err) {
            return fallbackMsg
        }
    }

    async function requestJson(url, options = {}, fallbackMsg = '请求失败，请稍后重试') {
        const res = await fetch(url, options)
        if (!res.ok) {
            const msg = await parseErrorMessage(res, fallbackMsg)
            throw new Error(msg)
        }
        return await res.json()
    }

    function switchAuthMode() {
        isLoginMode = !isLoginMode
        document.getElementById('authTitle').innerText = isLoginMode ? '管理员登录' : '管理员注册'
        document.getElementById('submitBtn').innerText = isLoginMode ? '登录' : '注册'
        document.getElementById('switchText').innerText = isLoginMode ? '还没有账号？' : '已有账号？'
        document.getElementById('switchLink').innerText = isLoginMode ? '立即注册' : '立即登录'
    }

    document.getElementById('productForm').addEventListener('submit', async function(e) {
        e.preventDefault()

        const token = localStorage.getItem('admin_token')
        if (!token) {
            alert('请先登录')
            return
        }

        const name = document.getElementById('productName').value.trim()
        const price = document.getElementById('productPrice').value
        const stock = document.getElementById('productStock').value
        const cid = document.getElementById('productCategory').value
        const img = document.getElementById('productImage').value.trim()

        if (!name) {
            alert('请输入产品名称')
            return
        }
        if (!price || parseFloat(price) < 0) {
            alert('请输入正确的价格')
            return
        }

        try {
            const data = await requestJson(API + '/api/admin/goods', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    name: name,
                    price: parseFloat(price),
                    stock: parseInt(stock) || 0,
                    cid: cid ? parseInt(cid) : null,
                    img: img
                })
            }, '添加商品失败')

            alert('商品添加成功！')
            document.getElementById('productForm').reset()
            document.getElementById('productStock').value = '100'
        } catch (error) {
            console.error('添加商品失败:', error)
            alert(error.message || '添加商品失败')
        }
    })

    function switchPage(page) {
        const pages = ['addProductPage', 'allProductsPage', 'stockManagePage', 'uploadImagePage', 'allOrdersPage']
        pages.forEach(p => document.getElementById(p).style.display = 'none')

        document.getElementById(page + 'Page').style.display = 'block'
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'))
        event.target.classList.add('active')

        if (page === 'allProducts') loadAdminProducts()
        if (page === 'stockManage') loadProducts()
        if (page === 'allOrders') loadOrders()
        if (page === 'addProduct') loadCategories()
    }

    async function loadCategories() {
        const select = document.getElementById('productCategory')
        select.innerHTML = '<option value="">请选择分类</option>'
        try {
            const data = await requestJson(API + '/api/category', {}, '分类加载失败')
            if (data.data) {
                data.data.forEach(cat => {
                    select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`
                })
            }
        } catch (error) {
            console.error('加载分类失败:', error)
            alert(error.message || '分类加载失败')
        }
    }

    async function loadProducts() {
        const stockTbody = document.querySelector('#stockTable tbody')
        stockTbody.innerHTML = ''

        const token = localStorage.getItem('admin_token')

        try {
            const data = await requestJson(API + '/api/stock/list?page=1&size=100', {
                headers: {'Authorization': `Bearer ${token}`}
            }, '库存加载失败')

            if (data.data && data.data.list) {
                data.data.list.forEach(product => {
                    stockTbody.innerHTML += `
                    <tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>${product.stock}</td>
                        <td><input type="number" class="stock-input" id="stock_${product.id}" value="0"></td>
                        <td><button class="save-stock" onclick="updateStock(${product.id})">更新</button></td>
                    </tr>
                `
                })
            } else {
                stockTbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;padding:40px">暂无库存数据</td></tr>'
            }
        } catch (error) {
            console.error('加载库存失败:', error)
            alert(error.message || '库存加载失败')
        }
    }

    async function loadAdminProducts(status = 'all', keyword = '') {
        const token = localStorage.getItem('admin_token')
        const container = document.getElementById('productList')
        container.innerHTML = '<div style="padding:40px;text-align:center;color:#999">加载中...</div>'

        try {
            let url = API + '/api/admin/goods/list?page=1&size=20'
            if (status !== 'all') {
                url += '&status=' + status
            }
            if (keyword) {
                url += '&keyword=' + encodeURIComponent(keyword)
            }

            const data = await requestJson(url, {
                headers: {'Authorization': `Bearer ${token}`}
            }, '产品加载失败')

            container.innerHTML = ''

            if (!data.data || !data.data.list || data.data.list.length === 0) {
                container.innerHTML = '<div style="padding:60px;text-align:center;color:#999">暂无产品</div>'
                return
            }

            data.data.list.forEach(product => {
                const statusClass = product.status === 0 ? 'status-draft' : (product.status === 1 ? 'status-onsale' : 'status-offshelf')
                const shelfAction = product.status === 1
                    ? `<button class="action-link" onclick="changeProductStatus(${product.id}, 2)">⬇ 立即下架</button>`
                    : `<button class="action-link" onclick="changeProductStatus(${product.id}, 1)">⬆ 立即上架</button>`

                const canUpshelf = product.status === 0 && product.stock > 0 ? '<div class="can-upshelf">✓ 可上架</div>' : ''

                container.innerHTML += `
                    <div class="product-item">
                        <div class="product-checkbox">
                            <input type="checkbox" class="product-check" data-id="${product.id}">
                        </div>
                        <div class="product-preview" onclick="previewProduct(${product.id})">
                            👁 客户端预览
                        </div>
                        <div class="product-main">
                            <div class="product-image">
                                <img src="${product.img || 'https://via.placeholder.com/100'}" alt="${product.name}">
                            </div>
                            <div class="product-info">
                                <div class="product-header">
                                    <span class="product-status ${statusClass}">${product.status_text}</span>
                                    <button class="action-link" onclick="copyProductLink(${product.id})">复制链接</button>
                                    <div class="product-actions">
                                        ${shelfAction}
                                        <button class="action-link" onclick="editAdminProduct(${product.id})">✎ 编辑产品</button>
                                    </div>
                                </div>
                                <div class="item-number">Item Number.${String(product.id).padStart(8, '0').toUpperCase()}</div>
                                <div class="product-name">${product.name}</div>
                                <div class="product-category">${product.category_name || '未分类'}</div>
                                <div class="product-stock-info">共有${product.stock || 0}款在售商品</div>
                                <div class="product-price">单价:¥${product.price}</div>
                                <div class="product-tags">
                                    <span class="tag-link">添加标签+</span>
                                </div>
                                ${canUpshelf}
                            </div>
                        </div>
                        <div class="product-sidebar">
                            <div class="update-info">
                                更新时间:${product.update_time || '-'}<br>
                                <span>修改人: ${product.editor || '管理员'}</span>
                            </div>
                            <div class="product-actions-bottom">
                                <button class="action-link" onclick="editAdminProduct(${product.id})">✎ 编辑产品</button>
                                <button class="action-link danger" onclick="deleteAdminProduct(${product.id})">🗑 删除产品</button>
                            </div>
                        </div>
                    </div>
                `
            })
        } catch (error) {
            console.error('加载产品失败:', error)
            container.innerHTML = `<div style="padding:40px;text-align:center;color:#e74c3c">${error.message || '加载失败'}</div>`
        }
    }

    function filterProducts(status) {
        currentProductStatus = status
        document.querySelectorAll('.product-tab').forEach(tab => tab.classList.remove('active'))
        event.target.classList.add('active')
        loadAdminProducts(status, currentProductKeyword)
    }

    function searchProducts(keyword) {
        currentProductKeyword = keyword
        loadAdminProducts(currentProductStatus, keyword)
    }

    function toggleFilter() {
        alert('筛选功能开发中...')
    }

    function sortProducts() {
        alert('排序功能开发中...')
    }

    function previewProduct(productId) {
        window.open(`${API}/frontend/index.html?product_id=${productId}`, '_blank')
    }

    function copyProductLink(productId) {
        const link = `${API}/frontend/index.html?product_id=${productId}`
        navigator.clipboard.writeText(link).then(() => {
            alert('链接已复制！')
        }).catch(() => {
            alert('复制失败，请手动复制')
        })
    }

    async function editAdminProduct(productId) {
        const token = localStorage.getItem('admin_token')

        try {
            const data = await requestJson(API + '/api/admin/goods/list?page=1&size=100', {
                headers: {'Authorization': `Bearer ${token}`}
            }, '商品加载失败')

            const product = data.data.list.find(p => p.id === productId)
            if (!product) {
                alert('商品不存在')
                return
            }

            const name = prompt('商品名称:', product.name)
            if (name === null) return

            const price = prompt('商品价格:', product.price)
            if (price === null) return

            const stock = prompt('商品库存:', product.stock || 0)
            if (stock === null) return

            const imageUrl = prompt('图片URL:', product.img || '')
            if (imageUrl === null) return

            const res = await fetch(API + '/api/admin/goods/' + productId, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    name: name.trim(),
                    price: parseFloat(price),
                    stock: parseInt(stock),
                    img: imageUrl.trim()
                })
            })

            if (!res.ok) {
                const msg = await parseErrorMessage(res, '更新失败')
                alert(msg)
                return
            }

            const result = await res.json()
            if (result.code === 200) {
                alert('更新成功')
                loadAdminProducts(currentProductStatus, currentProductKeyword)
            } else {
                alert(result.msg || '更新失败')
            }
        } catch (error) {
            console.error('更新商品失败:', error)
            alert(error.message || '更新失败')
        }
    }

    async function deleteAdminProduct(productId) {
        if (!confirm('确定要删除这个商品吗？此操作不可恢复！')) {
            return
        }

        const token = localStorage.getItem('admin_token')

        try {
            const res = await fetch(API + '/api/admin/goods/' + productId, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })

            if (!res.ok) {
                const msg = await parseErrorMessage(res, '删除失败')
                alert(msg)
                return
            }

            const result = await res.json()
            if (result.code === 200) {
                alert('删除成功')
                loadAdminProducts(currentProductStatus, currentProductKeyword)
            } else {
                alert(result.msg || '删除失败')
            }
        } catch (error) {
            console.error('删除商品失败:', error)
            alert(error.message || '删除失败')
        }
    }

    async function changeProductStatus(productId, newStatus) {
        const token = localStorage.getItem('admin_token')
        const statusText = newStatus === 1 ? '上架' : '下架'

        if (!confirm(`确定要${statusText}这个商品吗？`)) {
            return
        }

        try {
            const res = await fetch(API + '/api/admin/goods/' + productId + '/status', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({status: newStatus})
            })

            if (!res.ok) {
                const msg = await parseErrorMessage(res, '操作失败')
                alert(msg)
                return
            }

            const result = await res.json()
            if (result.code === 200) {
                alert(`${statusText}成功`)
                loadAdminProducts(currentProductStatus, currentProductKeyword)
            } else {
                alert(result.msg || '操作失败')
            }
        } catch (error) {
            console.error('更新状态失败:', error)
            alert(error.message || '操作失败')
        }
    }

    async function loadOrders(status = null) {
        const token = localStorage.getItem('admin_token')
        const tbody = document.querySelector('#ordersTable tbody')
        tbody.innerHTML = ''
        try {
            const data = await requestJson(
                API + '/api/order/admin/list' + (status ? '?status=' + status : ''),
                {headers: {'Authorization': `Bearer ${token}`}},
                '订单加载失败'
            )
            if (data.data) {
                data.data.forEach(order => {
                    const goodsList = order.items.map(item => item.goods_name).join(', ')
                    tbody.innerHTML += `
                    <tr>
                        <td>${order.order_id}</td>
                        <td>${order.username}</td>
                        <td>${goodsList}</td>
                        <td>¥${order.total_amount}</td>
                        <td><span class="status-badge status-${order.status}">${order.status_text}</span></td>
                        <td>${order.create_time}</td>
                        <td>
                            <button class="action-btn btn-view" onclick="viewOrder('${order.order_id}')">查看</button>
                            <button class="action-btn btn-edit" onclick="updateOrderStatus('${order.order_id}')">更新状态</button>
                        </td>
                    </tr>
                `
                })
            }
        } catch (error) {
            console.error('加载订单失败:', error)
            alert(error.message || '订单加载失败')
        }
    }

    function filterOrders(status) {
        document.querySelectorAll('.order-tab').forEach(tab => tab.classList.remove('active'))
        event.target.classList.add('active')
        loadOrders(status)
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const username = document.getElementById('username').value.trim()
        const password = document.getElementById('password').value

        try {
            if (isLoginMode) {
                const res = await fetch(API + '/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                })
                if (!res.ok) {
                    const msg = await parseErrorMessage(res, '登录失败，请稍后重试')
                    alert(msg)
                    return
                }

                const data = await res.json()
                if (data.code === 200) {
                    localStorage.setItem('admin_token', data.data.token)
                    currentAdmin = data.data.admin
                    showAdminPanel()
                } else {
                    alert(data.msg || '登录失败')
                }
            } else {
                const res = await fetch(API + '/api/admin/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                })
                if (!res.ok) {
                    const msg = await parseErrorMessage(res, '注册失败，请稍后重试')
                    alert(msg)
                    return
                }

                const data = await res.json()
                if (data.code === 200) {
                    alert('注册成功，请登录')
                    switchAuthMode()
                } else {
                    alert(data.msg || '注册失败')
                }
            }
        } catch (error) {
            console.error('管理员认证请求异常:', error)
            alert('网络连接失败，请检查后端服务是否启动')
        }
    })

    function showAdminPanel() {
        document.getElementById('authApp').style.display = 'none'
        document.getElementById('adminLayout').style.display = 'block'
        loadCategories()
    }

    function logout() {
        localStorage.removeItem('admin_token')
        location.reload()
    }

    async function updateStock(productId) {
        const input = document.getElementById('stock_' + productId)
        const stockValue = parseInt(input.value)
        if (isNaN(stockValue)) return alert('请输入调整数量')

        const token = localStorage.getItem('admin_token')
        try {
            const data = await requestJson(API + '/api/stock/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    goods_id: productId,
                    stock: stockValue,
                    operation: 'set'
                })
            }, '库存更新失败')

            alert('库存更新成功')

            const currentStockCell = input.parentElement.previousElementSibling
            if (currentStockCell) {
                currentStockCell.textContent = stockValue
            }
            input.value = 0
        } catch (error) {
            console.error('更新库存失败:', error)
            alert(error.message || '库存更新失败')
        }
    }

    async function viewOrder(orderId) {
        const token = localStorage.getItem('admin_token')
        try {
            const data = await requestJson(API + '/api/order/detail/' + orderId, {
                headers: {'Authorization': `Bearer ${token}`}
            }, '订单详情加载失败')
            if (data.code === 200) {
                let msg = `订单号：${data.data.order_id}\n`
                msg += `状态：${data.data.status_text}\n`
                msg += `总金额：¥${data.data.total_amount}\n`
                msg += `下单时间：${data.data.create_time}\n\n商品明细：\n`
                data.data.items.forEach(item => {
                    msg += `- ${item.goods_name} x${item.count} = ¥${item.total_price}\n`
                })
                alert(msg)
            } else {
                alert(data.msg || '订单详情加载失败')
            }
        } catch (error) {
            console.error('查看订单失败:', error)
            alert(error.message || '订单详情加载失败')
        }
    }

    async function updateOrderStatus(orderId) {
        const newStatus = prompt('请输入新状态 (0:待付款 1:已付款 2:已发货 3:已完成 4:已取消):')
        if (newStatus === null) return

        const parsedStatus = parseInt(newStatus, 10)
        if (Number.isNaN(parsedStatus) || parsedStatus < 0 || parsedStatus > 4) {
            alert('请输入 0 到 4 之间的状态值')
            return
        }

        const token = localStorage.getItem('admin_token')
        try {
            const data = await requestJson(API + '/api/admin/order/status', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({order_id: orderId, status: parsedStatus})
            }, '状态更新失败')
            if (data.code === 200) {
                alert('状态更新成功')
                loadOrders()
            } else {
                alert(data.msg || '状态更新失败')
            }
        } catch (error) {
            console.error('更新订单状态失败:', error)
            alert(error.message || '状态更新失败')
        }
    }

    if (localStorage.getItem('admin_token')) {
        showAdminPanel()
    }

    function handleFileUpload(input) {
        const file = input.files[0]
        if (!file) return

        const formData = new FormData()
        formData.append('file', file)

        document.querySelector('#uploadArea p').innerText = '上传中...'

        fetch(API + '/api/upload', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                const fullUrl = API + data.data.image_url
                document.getElementById('uploadResult').style.display = 'block'
                document.getElementById('previewImage').src = fullUrl
                document.getElementById('imageUrl').value = fullUrl
                document.querySelector('#uploadArea p').innerText = '点击或拖拽图片到此区域上传'
            } else {
                alert(data.msg || '上传失败')
                document.querySelector('#uploadArea p').innerText = '点击或拖拽图片到此区域上传'
            }
        })
        .catch(err => {
            alert('上传失败')
            document.querySelector('#uploadArea p').innerText = '点击或拖拽图片到此区域上传'
        })
    }

    function copyImageUrl() {
        const urlInput = document.getElementById('imageUrl')
        urlInput.select()
        document.execCommand('copy')
        alert('URL已复制到剪贴板')
    }

    const uploadArea = document.getElementById('uploadArea')
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault()
        uploadArea.style.borderColor = '#409eff'
    })
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.borderColor = '#ddd'
    })
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault()
        uploadArea.style.borderColor = '#ddd'
        const file = e.dataTransfer.files[0]
        if (file && file.type.startsWith('image/')) {
            const input = document.getElementById('fileInput')
            const dt = new DataTransfer()
            dt.items.add(file)
            input.files = dt.files
            handleFileUpload(input)
        }
    })
</script>
