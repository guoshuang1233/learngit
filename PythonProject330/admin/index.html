<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>后台管理系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei}
        body{background:#f0f2f5}

        .auth-container{max-width:400px;margin:150px auto;padding:40px;background:white;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.1)}
        .auth-title{text-align:center;font-size:24px;margin-bottom:30px;color:#333}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;margin-bottom:8px;color:#606266;font-size:14px}
        .form-group input{width:100%;padding:12px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px}
        .form-group input:focus{border-color:#409eff;outline:none}
        .submit-btn{width:100%;padding:12px;background:#34495e;color:white;border:none;border-radius:4px;font-size:16px;cursor:pointer}
        .submit-btn:hover{background:#2c3e50}
        .switch-auth{text-align:center;margin-top:20px;color:#606266}
        .switch-auth a{color:#409eff;cursor:pointer;text-decoration:none}

        .admin-layout{display:none;height:100vh}
        .sidebar{width:250px;background:#34495e;color:white;height:100vh;position:fixed;left:0;top:0;overflow-y:auto}
        .sidebar-header{padding:20px;text-align:center;font-size:20px;font-weight:bold;border-bottom:1px solid #2c3e50}
        .sidebar-menu{padding:20px 0}
        .menu-title{padding:12px 20px;color:#95a5a6;font-size:13px;text-transform:uppercase;margin-top:10px}
        .menu-item{padding:12px 20px;cursor:pointer;transition:all 0.3s;color:#ecf0f1}
        .menu-item:hover{background:#2c3e50}
        .menu-item.active{background:#2c3e50;border-left:3px solid #409eff}
        .logout-btn{width:100%;padding:12px;background:#e74c3c;color:white;border:none;cursor:pointer;font-size:14px}
        .logout-btn:hover{background:#c0392b}

        .main-content{margin-left:250px;padding:30px;min-height:100vh}
        .page-header{background:white;padding:20px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
        .page-title{font-size:24px;color:#333}

        .content-card{background:white;border-radius:8px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}

        .order-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
        .order-tab{padding:10px 20px;background:#95a5a6;color:white;border:none;border-radius:4px;cursor:pointer}
        .order-tab.active{background:#f39c12}
        .order-tab:hover{opacity:0.9}

        .filter-bar{display:flex;gap:15px;margin-bottom:20px;align-items:center}
        .filter-bar input{flex:1;padding:10px;border:1px solid #ddd;border-radius:4px}
        .filter-bar select{padding:10px;border:1px solid #ddd;border-radius:4px}

        table{width:100%;border-collapse:collapse}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
        th{background:#f8f9fa;font-weight:600;color:#333}
        tr:hover{background:#f5f5f5}

        .status-badge{padding:4px 12px;border-radius:12px;font-size:12px;color:white}
        .status-0{background:#f39c12}
        .status-1{background:#27ae60}
        .status-2{background:#3498db}
        .status-3{background:#2ecc71}
        .status-4{background:#e74c3c}

        .action-btn{padding:6px 12px;margin:0 4px;border:none;border-radius:4px;cursor:pointer;font-size:12px}
        .btn-view{background:#3498db;color:white}
        .btn-edit{background:#f39c12;color:white}
        .btn-delete{background:#e74c3c;color:white}

        .product-form{max-width:600px}
        .product-form .form-group{margin-bottom:20px}
        .product-form label{display:block;margin-bottom:8px;color:#606266;font-weight:500}
        .product-form input,.product-form select,.product-form textarea{width:100%;padding:10px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px}
        .product-form textarea{min-height:100px;resize:vertical}
        .submit-product{padding:12px 30px;background:#34495e;color:white;border:none;border-radius:4px;cursor:pointer;font-size:15px}
        .submit-product:hover{background:#2c3e50}

        .stock-input{width:80px;padding:6px;border:1px solid #ddd;border-radius:4px}
        .save-stock{padding:6px 12px;background:#27ae60;color:white;border:none;border-radius:4px;cursor:pointer;margin-left:10px}
    </style>
</head>
<body>
    <div class="auth-container" id="authApp">
        <div class="auth-title" id="authTitle">管理员登录</div>
        <form id="authForm">
            <div class="form-group">
                <label>用户名</label>
                <input id="username" placeholder="请输入用户名" required type="text">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input id="password" placeholder="请输入密码" required type="password">
            </div>
            <button class="submit-btn" id="submitBtn" type="submit">登录</button>
            <div class="switch-auth">
                <span id="switchText">还没有账号？</span>
                <a href="javascript:void(0)" id="switchLink" onclick="switchAuthMode(); return false;">立即注册</a>
            </div>
        </form>
    </div>

    <div class="admin-layout" id="adminLayout">
        <div class="sidebar">
            <div class="sidebar-header"> 后台管理</div>
            <div class="sidebar-menu">
                <div class="menu-title">产品管理</div>
                <div class="menu-item active" onclick="switchPage('addProduct')">添加产品</div>
                <div class="menu-item" onclick="switchPage('allProducts')">全部产品</div>
                <div class="menu-item" onclick="switchPage('stockManage')">库存管理</div>
                <div class="menu-item" onclick="switchPage('uploadImage')">图片上传</div>

                <div class="menu-title">订单管理</div>
                <div class="menu-item" onclick="switchPage('allOrders')">全部订单</div>
            </div>
            <div style="position:absolute;bottom:0;width:100%">
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="main-content">
            <div id="addProductPage">
                <div class="page-header"><h1 class="page-title">添加产品</h1></div>
                <div class="content-card product-form">
                    <form id="productForm">
                        <div class="form-group">
                            <label>产品名称</label>
                            <input id="productName" required type="text">
                        </div>
                        <div class="form-group">
                            <label>价格 (¥)</label>
                            <input id="productPrice" required step="0.01" type="number">
                        </div>
                        <div class="form-group">
                            <label>库存</label>
                            <input id="productStock" required type="number" value="100">
                        </div>
                        <div class="form-group">
                            <label>分类</label>
                            <select id="productCategory">
                                <option value="">请选择分类</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>图片 URL</label>
                            <input id="productImage" placeholder="http://..." type="text">
                        </div>
                        <button class="submit-product" type="submit">提交产品</button>
                    </form>
                </div>
            </div>

            <div id="allProductsPage" style="display:none">
                <div class="page-header"><h1 class="page-title">全部产品</h1></div>
                <div class="content-card">
                    <table id="productsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>图片</th>
                                <th>名称</th>
                                <th>价格</th>
                                <th>库存</th>
                                <th>分类</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="stockManagePage" style="display:none">
                <div class="page-header"><h1 class="page-title">库存管理</h1></div>
                <div class="content-card">
                    <table id="stockTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>产品名称</th>
                                <th>当前库存</th>
                                <th>调整数量</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div id="uploadImagePage" style="display:none">
                <div class="page-header"><h1 class="page-title">图片上传</h1></div>
                <div class="content-card">
                    <div id="uploadArea" onclick="document.getElementById('fileInput').click()" style="padding:40px;text-align:center;border:2px dashed #ddd;border-radius:8px;cursor:pointer">
                        <p style="color:#999">点击或拖拽图片到此区域上传</p>
                        <input accept="image/*" id="fileInput" onchange="handleFileUpload(this)" style="display:none" type="file">
                    </div>
                    <div id="uploadResult" style="margin-top:20px;display:none">
                        <p style="color:#27ae60">上传成功!</p>
                        <img id="previewImage" style="max-width:300px;margin:10px 0;border-radius:4px">
                        <div style="display:flex;gap:10px;align-items:center">
                            <input id="imageUrl" readonly style="flex:1;padding:8px;border:1px solid #ddd;border-radius:4px" type="text">
                            <button onclick="copyImageUrl()" style="padding:8px 16px;background:#409eff;color:white;border:none;border-radius:4px;cursor:pointer">复制URL</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="allOrdersPage" style="display:none">
                <div class="page-header"><h1 class="page-title">订单管理</h1></div>
                <div class="content-card">
                    <div class="order-tabs">
                        <button class="order-tab active" onclick="filterOrders(0)">全部订单</button>
                        <button class="order-tab" onclick="filterOrders(1)">待付款</button>
                        <button class="order-tab" onclick="filterOrders(2)">已付款</button>
                        <button class="order-tab" onclick="filterOrders(3)">已发货</button>
                        <button class="order-tab" onclick="filterOrders(4)">已完成</button>
                        <button class="order-tab" onclick="filterOrders(5)">已取消</button>
                    </div>
                    <div class="filter-bar">
                        <input id="orderSearch" placeholder="搜索订单号或用户名" type="text">
                        <select id="timeRange">
                            <option value="6">最近六个月</option>
                            <option value="3">最近三个月</option>
                            <option value="1">最近一个月</option>
                            <option value="0">全部</option>
                        </select>
                        <button class="action-btn btn-view" onclick="loadOrders()">搜索</button>
                    </div>
                    <table id="ordersTable">
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>用户</th>
                                <th>商品</th>
                                <th>总金额</th>
                                <th>状态</th>
                                <th>下单时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
    const API = 'http://127.0.0.1:5000'
    let isLoginMode = true
    let currentAdmin = null

    async function parseErrorMessage(res, fallbackMsg) {
        try {
            const data = await res.json()
            return (data && data.msg) ? data.msg : fallbackMsg
        } catch (err) {
            return fallbackMsg
        }
    }

    async function requestJson(url, options = {}, fallbackMsg = '请求失败，请稍后重试') {
        const res = await fetch(url, options)
        if (!res.ok) {
            const msg = await parseErrorMessage(res, fallbackMsg)
            throw new Error(msg)
        }
        return await res.json()
    }

    function switchAuthMode() {
        isLoginMode = !isLoginMode
        document.getElementById('authTitle').innerText = isLoginMode ? '管理员登录' : '管理员注册'
        document.getElementById('submitBtn').innerText = isLoginMode ? '登录' : '注册'
        document.getElementById('switchText').innerText = isLoginMode ? '还没有账号？' : '已有账号？'
        document.getElementById('switchLink').innerText = isLoginMode ? '立即注册' : '立即登录'
    }

    function switchPage(page) {
        const pages = ['addProductPage', 'allProductsPage', 'stockManagePage', 'uploadImagePage', 'allOrdersPage']
        pages.forEach(p => document.getElementById(p).style.display = 'none')

        document.getElementById(page + 'Page').style.display = 'block'
        document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'))
        event.target.classList.add('active')

        if (page === 'allProducts' || page === 'stockManage') loadProducts()
        if (page === 'allOrders') loadOrders()
        if (page === 'addProduct') loadCategories()
    }

    async function loadCategories() {
        const select = document.getElementById('productCategory')
        select.innerHTML = '<option value="">请选择分类</option>'
        try {
            const data = await requestJson(API + '/api/category', {}, '分类加载失败')
            if (data.data) {
                data.data.forEach(cat => {
                    select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`
                })
            }
        } catch (error) {
            console.error('加载分类失败:', error)
            alert(error.message || '分类加载失败')
        }
    }

    async function loadProducts() {
        const tbody = document.querySelector('#productsTable tbody')
        const stockTbody = document.querySelector('#stockTable tbody')
        tbody.innerHTML = ''
        stockTbody.innerHTML = ''
        try {
            const data = await requestJson(API + '/api/goods?page=1&size=100', {}, '产品加载失败')
            if (data.data && data.data.list) {
                data.data.list.forEach(product => {
                    tbody.innerHTML += `
                    <tr>
                        <td>${product.id}</td>
                        <td><img src="${product.img}" style="width:60px;height:60px;object-fit:cover;border-radius:4px"></td>
                        <td>${product.name}</td>
                        <td>¥${product.price}</td>
                        <td>${product.stock || 0}</td>
                        <td>${product.category_name || '-'}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="editProduct(${product.id})">编辑</button>
                            <button class="action-btn btn-delete" onclick="deleteProduct(${product.id})">删除</button>
                        </td>
                    </tr>
                `
                stockTbody.innerHTML += `
                    <tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>${product.stock || 0}</td>
                        <td><input type="number" class="stock-input" id="stock_${product.id}" value="0"></td>
                        <td><button class="save-stock" onclick="updateStock(${product.id})">更新</button></td>
                    </tr>
                `
                })
            }
        } catch (error) {
            console.error('加载产品失败:', error)
            alert(error.message || '产品加载失败')
        }
    }

    async function loadOrders(status = null) {
        const token = localStorage.getItem('admin_token')
        const tbody = document.querySelector('#ordersTable tbody')
        tbody.innerHTML = ''
        try {
            const data = await requestJson(
                API + '/api/order/admin/list' + (status ? '?status=' + status : ''),
                {headers: {'Authorization': `Bearer ${token}`}},
                '订单加载失败'
            )
            if (data.data) {
                data.data.forEach(order => {
                    const goodsList = order.items.map(item => item.goods_name).join(', ')
                    tbody.innerHTML += `
                    <tr>
                        <td>${order.order_id}</td>
                        <td>${order.username}</td>
                        <td>${goodsList}</td>
                        <td>¥${order.total_amount}</td>
                        <td><span class="status-badge status-${order.status}">${order.status_text}</span></td>
                        <td>${order.create_time}</td>
                        <td>
                            <button class="action-btn btn-view" onclick="viewOrder('${order.order_id}')">查看</button>
                            <button class="action-btn btn-edit" onclick="updateOrderStatus('${order.order_id}')">更新状态</button>
                        </td>
                    </tr>
                `
                })
            }
        } catch (error) {
            console.error('加载订单失败:', error)
            alert(error.message || '订单加载失败')
        }
    }

    function filterOrders(status) {
        document.querySelectorAll('.order-tab').forEach(tab => tab.classList.remove('active'))
        event.target.classList.add('active')
        loadOrders(status)
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const username = document.getElementById('username').value.trim()
        const password = document.getElementById('password').value

        try {
            if (isLoginMode) {
                const res = await fetch(API + '/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                })
                if (!res.ok) {
                    const msg = await parseErrorMessage(res, '登录失败，请稍后重试')
                    alert(msg)
                    return
                }

                const data = await res.json()
                if (data.code === 200) {
                    localStorage.setItem('admin_token', data.data.token)
                    currentAdmin = data.data.admin
                    showAdminPanel()
                } else {
                    alert(data.msg || '登录失败')
                }
            } else {
                const res = await fetch(API + '/api/admin/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                })
                if (!res.ok) {
                    const msg = await parseErrorMessage(res, '注册失败，请稍后重试')
                    alert(msg)
                    return
                }

                const data = await res.json()
                if (data.code === 200) {
                    alert('注册成功，请登录')
                    switchAuthMode()
                } else {
                    alert(data.msg || '注册失败')
                }
            }
        } catch (error) {
            console.error('管理员认证请求异常:', error)
            alert('网络连接失败，请检查后端服务是否启动')
        }
    })

    function showAdminPanel() {
        document.getElementById('authApp').style.display = 'none'
        document.getElementById('adminLayout').style.display = 'block'
        loadCategories()
    }

    function logout() {
        localStorage.removeItem('admin_token')
        location.reload()
    }

    async function updateStock(productId) {
        const input = document.getElementById(`stock_${productId}`)
        const change = parseInt(input.value)
        if (!change) return alert('请输入调整数量')

        const token = localStorage.getItem('admin_token')
        try {
            const data = await requestJson(API + '/api/admin/goods/stock', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({goods_id: productId, stock_change: change})
            }, '库存更新失败')
            if (data.code === 200) {
                alert('库存更新成功')
                loadProducts()
            } else {
                alert(data.msg || '库存更新失败')
            }
        } catch (error) {
            console.error('更新库存失败:', error)
            alert(error.message || '库存更新失败')
        }
    }

    async function viewOrder(orderId) {
        const token = localStorage.getItem('admin_token')
        try {
            const data = await requestJson(API + '/api/order/detail/' + orderId, {
                headers: {'Authorization': `Bearer ${token}`}
            }, '订单详情加载失败')
            if (data.code === 200) {
                let msg = `订单号：${data.data.order_id}\n`
                msg += `状态：${data.data.status_text}\n`
                msg += `总金额：¥${data.data.total_amount}\n`
                msg += `下单时间：${data.data.create_time}\n\n商品明细：\n`
                data.data.items.forEach(item => {
                    msg += `- ${item.goods_name} x${item.count} = ¥${item.total_price}\n`
                })
                alert(msg)
            } else {
                alert(data.msg || '订单详情加载失败')
            }
        } catch (error) {
            console.error('查看订单失败:', error)
            alert(error.message || '订单详情加载失败')
        }
    }

    async function updateOrderStatus(orderId) {
        const newStatus = prompt('请输入新状态 (0:待付款 1:已付款 2:已发货 3:已完成 4:已取消):')
        if (newStatus === null) return

        const parsedStatus = parseInt(newStatus, 10)
        if (Number.isNaN(parsedStatus) || parsedStatus < 0 || parsedStatus > 4) {
            alert('请输入 0 到 4 之间的状态值')
            return
        }

        const token = localStorage.getItem('admin_token')
        try {
            const data = await requestJson(API + '/api/admin/order/status', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({order_id: orderId, status: parsedStatus})
            }, '状态更新失败')
            if (data.code === 200) {
                alert('状态更新成功')
                loadOrders()
            } else {
                alert(data.msg || '状态更新失败')
            }
        } catch (error) {
            console.error('更新订单状态失败:', error)
            alert(error.message || '状态更新失败')
        }
    }

    if (localStorage.getItem('admin_token')) {
        showAdminPanel()
    }

    function handleFileUpload(input) {
        const file = input.files[0]
        if (!file) return

        const formData = new FormData()
        formData.append('file', file)

        document.querySelector('#uploadArea p').innerText = '上传中...'

        fetch(API + '/api/upload', {
            method: 'POST',
            body: formData
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 200) {
                const fullUrl = API + data.data.image_url
                document.getElementById('uploadResult').style.display = 'block'
                document.getElementById('previewImage').src = fullUrl
                document.getElementById('imageUrl').value = fullUrl
                document.querySelector('#uploadArea p').innerText = '点击或拖拽图片到此区域上传'
            } else {
                alert(data.msg || '上传失败')
                document.querySelector('#uploadArea p').innerText = '点击或拖拽图片到此区域上传'
            }
        })
        .catch(err => {
            alert('上传失败')
            document.querySelector('#uploadArea p').innerText = '点击或拖拽图片到此区域上传'
        })
    }

    function copyImageUrl() {
        const urlInput = document.getElementById('imageUrl')
        urlInput.select()
        document.execCommand('copy')
        alert('URL已复制到剪贴板')
    }

    // 拖拽上传
    const uploadArea = document.getElementById('uploadArea')
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault()
        uploadArea.style.borderColor = '#409eff'
    })
    uploadArea.addEventListener('dragleave', () => {
        uploadArea.style.borderColor = '#ddd'
    })
    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault()
        uploadArea.style.borderColor = '#ddd'
        const file = e.dataTransfer.files[0]
        if (file && file.type.startsWith('image/')) {
            const input = document.getElementById('fileInput')
            const dt = new DataTransfer()
            dt.items.add(file)
            input.files = dt.files
            handleFileUpload(input)
        }
    })
</script>
</body>
</html>
